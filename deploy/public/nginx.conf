# Example server block. Enable TLS with your compliant CDN / Caddy / certificate setup.
# Never point this root at the home CMS data volume.
server {
    listen 127.0.0.1:8081;
    server_name _;
    root /srv/home-blog-public/current;
    index index.html;
    autoindex off;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'" always;

    location ~ ^/(admin|api|_next)(/|$) { return 404; }
    location ~ (^|/)\. { return 404; }
    location = /release-manifest.json { return 404; }
    location = /healthz { access_log off; default_type text/plain; try_files /healthz =404; }
    location /assets/ { expires 1h; try_files $uri =404; }
    location /media/ { expires 1d; try_files $uri =404; }
    location = /search-index.json { expires 1m; try_files $uri =404; }
    location / { expires 1m; try_files $uri $uri/ =404; }
}
