name: Publish tested V5 image
on:
  workflow_run:
    workflows: ["V5 validate"]
    types: [completed]
permissions:
  contents: read
  packages: write
jobs:
  image:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/1998x-stack/home-blog:main
            ghcr.io/1998x-stack/home-blog:sha-${{ github.event.workflow_run.head_sha }}
          labels: org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
