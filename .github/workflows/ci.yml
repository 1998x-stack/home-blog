name: V5 validate
on:
  push:
    branches: [main, v5.0]
  pull_request:
    branches: [main, v5.0]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: sudo apt-get update && sudo apt-get install -y sqlite3 nginx
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
        env: {DATABASE_URL: 'file:./test.db'}
      - run: bash -n scripts/deploy/ecs-workbench.sh scripts/deploy/local-build-image.sh scripts/public/publish-public.sh
      - run: npm test
      - run: npm run public:test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          DATABASE_URL: 'file:./test.db'
          CSRF_SECRET: 'unit-test-only-secret-should-not-go-to-prod'
          APP_ORIGIN: 'http://localhost:3000'
          NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'
      - run: npx prisma migrate deploy
        env: {DATABASE_URL: 'file:./test.db'}
      - name: Nginx static mirror config syntax
        run: sudo cp deploy/public/nginx.conf /etc/nginx/conf.d/home-blog-public.conf && sudo nginx -t
      - name: Validate production Docker image
        run: docker build --progress=plain -t home-blog:ci .
