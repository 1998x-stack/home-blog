name: Validate and export
on:
  push:
    branches: [v1.0]
  pull_request:
    branches: [v1.0]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
      - name: Verify generated artifacts
        run: |
          test -f out/index.html
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/feed.xml
          test -f out/articles/why-this-blog/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: home-blog-static
          path: out/
          retention-days: 7
