services:
  home-blog:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_ORIGIN: ${APP_ORIGIN:?configure APP_ORIGIN}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?configure NEXT_PUBLIC_SITE_URL}
      SITE_URL: ${NEXT_PUBLIC_SITE_URL:?configure NEXT_PUBLIC_SITE_URL}
      DATABASE_URL: file:/data/blog.db
      MEDIA_DIR: /data/uploads
      CSRF_SECRET: ${CSRF_SECRET:?configure CSRF_SECRET}
    volumes:
      - blog_data:/data
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  blog_data: {}
